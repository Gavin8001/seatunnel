env {
  parallelism = 1
  job.mode = "BATCH"

  # You can set spark configuration here
  spark.app.name = "SeaTunnel"
  spark.executor.instances = 2
  spark.executor.cores = 1
  spark.executor.memory = "1g"
  spark.master = local
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        id = int
        name = string
        price = double
        is_active = boolean
        create_dt = date
      }
    }
    rows = [
      {
        kind = INSERT
        fields = [1, "张三", 99.99, true, "2024-01-15"]
      }
      {
        kind = INSERT
        fields = [2, "李四", 150.50, false, "2024-02-20"]
      }
      {
        kind = INSERT
        fields = [3, "王五", 75.25, true, "2024-03-10"]
      }
    ]
  }
}

sink {
  LocalFile {
    path = "/tmp/dbf/encoding/seatunnel"
    partition_dir_expression = "${k0}=${v0}"
    is_partition_field_write_in_file = true
    file_name_expression = "${transactionId}_${now}"
    file_format_type = "dbf"
    filename_time_format = "yyyy.MM.dd"
    is_enable_transaction = true
    encoding = "gbk"
  }
}
