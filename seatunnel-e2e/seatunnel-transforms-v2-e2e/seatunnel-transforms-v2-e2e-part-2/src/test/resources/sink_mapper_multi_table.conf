env {
  job.mode = "BATCH"
}

source {
  FakeSource {
      tables_configs = [
          {
            row.num = 5
            schema = {
              table = "test.abc"
              columns = [
                {
                  name = "id"
                  type = "int"
                },
                {
                  name = "age"
                  type = "int"
                },
                {
                  name = "name"
                  type = "string"
                }
              ]
            }
          },
          {
            row.num = 5
            schema = {
              table = "test.xyz"
              columns = [
                {
                  name = "id"
                  type = "int"
                },
                {
                  name = "age"
                  type = "int"
                },
                {
                  name = "name"
                  type = "string"
                }
              ]
            }
          },
      ]
  }
}

transform {
  SinkMapper {
    table_transform = [
      {
        table_path = "test.abc"
        columns = [
          {
            column = "name"
            nullable = false
            comment = "table1 name comment"
          }
        ]
        primary_key = ["id"]
        table_comment = "table1 comment"
      },
      {
        table_path = "test.xyz"
        columns = [
          {
            column = "age"
            nullable = false
            comment = "table2 age comment"
          }
        ]
        primary_key = ["id", "name"]
        table_comment = "table2 comment"
      }
    ]
  }
}

sink {
  Assert {
    rules =
      {
          tables_configs=[
              {
                  table_path = "test.abc"
                  catalog_table_rule {
                      primary_key_rule = {
                          primary_key_name = "test.abc"
                          primary_key_columns = ["id"]
                      }
                  }
                  field_rules = [
                       {
                            field_name = id
                            field_type = int
                            field_value = [
                              {
                                rule_type = NOT_NULL
                              }
                            ]
                       }
                  ]
              },
              {
                    table_path = "test.xyz"
                    catalog_table_rule {
                        primary_key_rule = {
                            primary_key_name = "test.xyz"
                            primary_key_columns = ["id","name"]
                        }
                    }
                    field_rules = [
                         {
                              field_name = age
                              field_type = int
                              field_value = [
                                {
                                  rule_type = NOT_NULL
                                }
                              ]
                         }
                    ]
                }
          ]
      }
  }
}
