env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 10
    schema = {
      fields {
        id = "int"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
  DefineSinkType {
      plugin_input = "fake"
      plugin_output = "fake1"
      columns = [
          {
              column = "id"
              type = "int"
          }
          {
              column = "name"
              type = "varchar(20)"
          }
          {
              column = "age"
              type = "int"
          }
      ]
  }
  SinkMapper {
    plugin_input = "fake1"
    plugin_output = "fake2"
    primary_key = ["id","name"]
    columns = [
      {
        column = "id"
        nullable = false
        comment = "id column comment"
      },
      {
        column = "name"
        nullable = false
        comment = "name column comment"
      },
      {
        column = "age"
        comment = "age column comment"
      }
    ]
    table_comment = "test basic table comment"
  }
}

sink {
  Jdbc {
    plugin_input = "fake2"
    driver = "com.mysql.cj.jdbc.Driver"
    url = "jdbc:mysql://192.168.31.62:3306"
    user = "root"
    password = "123456"
    database="ads_bi_prod"
    table = "sink_table"
    generate_sink_sql=true
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
  }
}
